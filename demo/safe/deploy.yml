# The same deployment as demo/vulnerable, with every issue fixed.
# No privileged mode, no Docker socket, no host mount, a pinned image.
services:
  agent-runtime:
    image: example/agent-runtime@sha256:3f1a9c0b8e2d4a6f5c7b1e9d0a2c4f6b8d0e2a4c6f8b0d2e4a6c8f0b2d4e6a8c
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "agent-data:/data"
volumes:
  agent-data:
