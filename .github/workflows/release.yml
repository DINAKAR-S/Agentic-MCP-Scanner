name: release

# Runs when a version tag is pushed. Builds the container image, publishes it to
# GitHub Packages (ghcr.io), and attaches the sdist and wheel to the release.
# PyPI publishing stays a manual step from the maintainer's machine.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mcpvuln
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test the pushed image
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/mcpvuln --self-check
          docker run --rm -v "$PWD/demo:/scan:ro" ghcr.io/${{ github.repository_owner }}/mcpvuln /scan/vulnerable --out /tmp -q

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          cd mcp-scan && python -m build
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: mcp-scan/dist/*
